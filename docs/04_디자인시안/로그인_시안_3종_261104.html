<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 시안 3종</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root { --bg:#F1F4FC; --ink:#262849; --sub:#6B7096; --sky:#7AB8F5; --sky-deep:#4A92DE; --sky-soft:#E6F1FD; --butter-soft:#FFF6DC; --butter-deep:#A9861F; --mint-soft:#E1F6EF; --mint-deep:#23876A; }
* { box-sizing:border-box; margin:0; }
body { background:#E6ECFA; color:var(--ink); font-family:Pretendard,-apple-system,system-ui,sans-serif; word-break:keep-all; padding:32px 16px 56px; }
h1 { text-align:center; font-size:22px; font-weight:800; }
.lead { text-align:center; color:var(--sub); font-size:14px; margin:6px 0 28px; }
.row { display:flex; flex-wrap:wrap; gap:36px; justify-content:center; }
figure { display:flex; flex-direction:column; align-items:center; gap:14px; }
figcaption { text-align:center; font-size:14px; color:var(--sub); max-width:300px; line-height:1.5; }
figcaption b { display:block; color:var(--ink); font-size:16px; margin-bottom:2px; }

/* 휴대폰 틀 */
.phone { width:340px; height:640px; border:11px solid #15172B; border-radius:48px; background:var(--bg); overflow:hidden; position:relative; box-shadow:0 24px 50px rgba(38,40,73,.28); }
.phone::before { content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:86px; height:24px; border-radius:16px; background:#15172B; z-index:3; }
.phone::after { content:""; position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:110px; height:4px; border-radius:2px; background:#15172B; }
.sb { height:40px; padding:10px 26px 0; font-size:13px; font-weight:800; }
.scr { padding:6px 18px 24px; display:flex; flex-direction:column; gap:12px; }
.logo { font-family:'Jua',sans-serif; font-size:26px; color:var(--sky-deep); padding:6px 2px 0; }
.hello { display:flex; align-items:flex-end; gap:8px; margin:6px 0 10px; }
.hello svg { width:80px; height:67px; flex:none; }
.say { background:#fff; border-radius:20px 20px 20px 6px; padding:12px 16px; font-size:16px; font-weight:700; line-height:1.4; margin-bottom:8px; }
.ico { width:44px; height:44px; display:grid; place-items:center; flex:none; }
.ico svg { width:26px; height:26px; }
button { font:inherit; color:inherit; border:0; text-align:left; cursor:pointer; }
.t { font-size:16px; font-weight:800; }
.dev { margin-top:8px; font-size:12.5px; color:var(--sub); text-decoration:underline; text-align:center; background:none; align-self:center; }

/* 시안 A — 톤온톤 면: 선·그림자 없이 색 면만 */
.A button.r { display:flex; align-items:center; gap:14px; width:100%; padding:16px 18px; border-radius:24px; }
.A .ico { border-radius:50%; background:#fff; }
.A .p { background:var(--sky-soft); } .A .p .ico { color:var(--sky-deep); }
.A .s { background:var(--butter-soft); } .A .s .ico { color:var(--butter-deep); }
.A .k { background:var(--mint-soft); } .A .k .ico { color:var(--mint-deep); }

/* 시안 B — 한 장 리스트: 흰 판 하나, 구분선 없이 간격만 */
.B .sheet { background:#fff; border-radius:28px; padding:10px; display:flex; flex-direction:column; gap:4px; }
.B button.r { display:flex; align-items:center; gap:14px; padding:14px 12px; border-radius:20px; background:none; width:100%; }
.B button.r:first-child { background:var(--sky-soft); }
.B .ico { border-radius:14px; }
.B .p .ico { background:var(--sky); color:#fff; } .B .s .ico { background:var(--butter-soft); color:var(--butter-deep); } .B .k .ico { background:var(--mint-soft); color:var(--mint-deep); }
.B .go { margin-left:auto; color:#B6BBD8; font-size:22px; font-weight:700; }

/* 시안 C — 큰 타일: 아이콘을 크게, 글자는 아래 */
.C .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.C button.r { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:140px; border-radius:28px; text-align:center; }
.C button.r.wide { grid-column:1 / -1; height:128px; }
.C .ico { width:60px; height:60px; border-radius:20px; background:#fff; }
.C .ico svg { width:34px; height:34px; }
.C .p { background:var(--sky-soft); } .C .p .ico { color:var(--sky-deep); }
.C .s { background:var(--butter-soft); } .C .s .ico { color:var(--butter-deep); }
.C .k { background:var(--mint-soft); } .C .k .ico { color:var(--mint-deep); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cb" viewBox="0 0 120 100">
      <path d="M16 20 Q60 6 104 20 Q116 50 104 80 Q60 94 16 80 Q4 50 16 20Z" fill="#FFD872" stroke="#262849" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M23 27 Q60 15 97 27 Q107 50 97 73 Q60 85 23 73 Q13 50 23 27Z" fill="none" stroke="#E9B83B" stroke-width="2" stroke-dasharray="4 4"/>
      <path d="M30 30 Q46 24 62 24" stroke="#FFF4CC" stroke-width="5" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="hi" viewBox="0 0 120 100">
      <use href="#cb"/>
      <ellipse cx="46" cy="50" rx="4.8" ry="6.4" fill="#262849"/><ellipse cx="74" cy="50" rx="4.8" ry="6.4" fill="#262849"/>
      <circle cx="47.6" cy="47.6" r="1.6" fill="#fff"/><circle cx="75.6" cy="47.6" r="1.6" fill="#fff"/>
      <ellipse cx="35" cy="62" rx="7" ry="4" fill="#F7A091" opacity=".75"/><ellipse cx="85" cy="62" rx="7" ry="4" fill="#F7A091" opacity=".75"/>
      <path d="M54 61 Q60 68 66 61" stroke="#262849" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-parent" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.2"/><path d="M3 20v-2.5A4.5 4.5 0 0 1 7.5 13h3A4.5 4.5 0 0 1 15 17.5V20"/><circle cx="17.5" cy="11.5" r="2.2"/><path d="M16.5 20v-1.8a3 3 0 0 1 3-3H21"/></g></symbol>
    <symbol id="i-teacher" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M7 9h6M7 12h4"/><path d="M8 20l2-4M16 20l-2-4"/></g></symbol>
    <symbol id="i-student" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.2V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.8"/><path d="M22 9v6"/></g></symbol>
  </defs>
</svg>

<h1>로그인 첫 화면 시안 3종</h1>
<p class="lead">버튼처럼 떠 있는 카드 대신, 테두리·그림자·구분선 없이 색 면과 간격으로만 나눴어요.</p>

<div class="row">

<figure>
  <div class="phone A">
    <div class="sb">9:41</div>
    <div class="scr">
      <div class="logo">쿠션톡</div>
      <div class="hello"><svg><use href="#hi"/></svg><div class="say">안녕하세요,<br>누구로 시작할까요?</div></div>
      <button class="r p"><span class="ico"><svg><use href="#i-parent"/></svg></span><span class="t">학부모</span></button>
      <button class="r s"><span class="ico"><svg><use href="#i-teacher"/></svg></span><span class="t">선생님 · 교직원</span></button>
      <button class="r k"><span class="ico"><svg><use href="#i-student"/></svg></span><span class="t">학생</span></button>
    </div>
  </div>
  <figcaption><b>A. 톤온톤 면</b>역할마다 연한 색 면 하나. 아이콘만 흰 원 안에 담아 가장 부드럽고 지금 디자인과 가까워요.</figcaption>
</figure>

<figure>
  <div class="phone B">
    <div class="sb">9:41</div>
    <div class="scr">
      <div class="logo">쿠션톡</div>
      <div class="hello"><svg><use href="#hi"/></svg><div class="say">안녕하세요,<br>누구로 시작할까요?</div></div>
      <div class="sheet">
        <button class="r p"><span class="ico"><svg><use href="#i-parent"/></svg></span><span class="t">학부모</span><span class="go">›</span></button>
        <button class="r s"><span class="ico"><svg><use href="#i-teacher"/></svg></span><span class="t">선생님 · 교직원</span><span class="go">›</span></button>
        <button class="r k"><span class="ico"><svg><use href="#i-student"/></svg></span><span class="t">학생</span><span class="go">›</span></button>
      </div>
    </div>
  </div>
  <figcaption><b>B. 한 장 리스트</b>흰 판 하나 안에 항목이 들어가 있는 형태. 구분선 없이 간격만 쓰고, 첫 항목만 살짝 강조해요.</figcaption>
</figure>

<figure>
  <div class="phone C">
    <div class="sb">9:41</div>
    <div class="scr">
      <div class="logo">쿠션톡</div>
      <div class="hello"><svg><use href="#hi"/></svg><div class="say">안녕하세요,<br>누구로 시작할까요?</div></div>
      <div class="tiles">
        <button class="r p wide"><span class="ico"><svg><use href="#i-parent"/></svg></span><span class="t">학부모</span></button>
        <button class="r s"><span class="ico"><svg><use href="#i-teacher"/></svg></span><span class="t">선생님 · 교직원</span></button>
        <button class="r k"><span class="ico"><svg><use href="#i-student"/></svg></span><span class="t">학생</span></button>
      </div>
    </div>
  </div>
  <figcaption><b>C. 큰 타일</b>아이콘을 크게 위에, 글자를 아래에. 학부모를 가장 넓게 두어 한눈에 구분돼요.</figcaption>
</figure>

</div>
</body>
</html>
